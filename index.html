<!DOCTYPE html>
<html>
    <head>
        <title>Sign-Up !</title>
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <div id="leftbody">
            <img src="./images/cat.jpg">
        </div>
        <div id="rightbody">
            <div id="rightrow1">
                <div id="rightrow1text">This is not real online service! You know you need something like this on your life to help you realise your deepest dreams.Signup up now to get started.<p>You know you want to.</p></div></div>
            <div id="rightrow2">
                <div id="rightrow2text">Let's do this!</div>
                <form id="sign-up-form" action="https://httpbin.org/post" method="post">
                    <div id="test1">
                        <div id="test2">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>
                        <div id="test3">
                            <label for="last_name">LAST NAME</label>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>
                            <label for="ph_no">PHONE NO</label>
                            <input type="number" id="ph_no" name="ph_no">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$">
                        </div>
                        <div>
                            <label for="cpassword">CONFIRM PASSWORD</label>
                            <input type="password" id="cpassword" name="cpassword" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$">
                        </div>
                    </div>
                </form>
            </div>
            <div id="rightrow3">
                <div>
                    <button type="submit" form="sign-up-form">Create Account</button>
                    <p>Already have an account? <a href="https://example.com">Log in</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
